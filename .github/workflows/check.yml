name: 检查

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 依赖漏洞扫描
        run: npm audit --audit-level=low

      - name: 发布包清单
        run: npm pack --dry-run

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test
